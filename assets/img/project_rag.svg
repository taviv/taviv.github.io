<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d1b2a"/>
  <!-- Background dots -->
  <g fill="#1a3a5c" opacity="0.5">
    <circle cx="100" cy="80" r="2"/><circle cx="200" cy="60" r="2"/><circle cx="350" cy="90" r="2"/>
    <circle cx="500" cy="70" r="2"/><circle cx="650" cy="85" r="2"/><circle cx="720" cy="55" r="2"/>
    <circle cx="80" cy="420" r="2"/><circle cx="180" cy="440" r="2"/><circle cx="700" cy="430" r="2"/>
  </g>
  <!-- PDF Document -->
  <rect x="55" y="140" width="120" height="155" rx="6" fill="#1a2744" stroke="#4a90d9" stroke-width="2"/>
  <rect x="55" y="140" width="120" height="30" rx="6" fill="#4a90d9"/>
  <rect x="55" y="160" width="120" height="10" fill="#4a90d9"/>
  <text x="115" y="161" text-anchor="middle" fill="white" font-family="monospace" font-size="11" font-weight="bold">PDF</text>
  <text x="115" y="178" text-anchor="middle" fill="#7ec8e3" font-family="monospace" font-size="9">Drug Monograph</text>
  <!-- doc lines -->
  <g stroke="#2e5a8e" stroke-width="1.5">
    <line x1="72" y1="195" x2="158" y2="195"/>
    <line x1="72" y1="208" x2="158" y2="208"/>
    <line x1="72" y1="221" x2="145" y2="221"/>
    <line x1="72" y1="234" x2="158" y2="234"/>
    <line x1="72" y1="247" x2="138" y2="247"/>
    <line x1="72" y1="260" x2="158" y2="260"/>
    <line x1="72" y1="273" x2="150" y2="273"/>
  </g>
  <text x="115" y="308" text-anchor="middle" fill="#7ec8e3" font-family="monospace" font-size="10">TNF Inhibitor</text>
  <!-- Arrow PDF -> Chunks -->
  <line x1="175" y1="218" x2="225" y2="218" stroke="#4a90d9" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90d9"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1abc9c"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f39c12"/>
    </marker>
  </defs>
  <!-- Chunker box -->
  <rect x="225" y="175" width="100" height="85" rx="6" fill="#162032" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="275" y="200" text-anchor="middle" fill="#1abc9c" font-family="monospace" font-size="10" font-weight="bold">Chunker</text>
  <text x="275" y="216" text-anchor="middle" fill="#a9dfbf" font-family="monospace" font-size="9">1000 chars</text>
  <text x="275" y="230" text-anchor="middle" fill="#a9dfbf" font-family="monospace" font-size="9">100 overlap</text>
  <text x="275" y="248" text-anchor="middle" fill="#7fb3d3" font-family="monospace" font-size="9">LangChain</text>
  <!-- Arrow chunks -> embedder -->
  <line x1="325" y1="218" x2="375" y2="218" stroke="#1abc9c" stroke-width="2" marker-end="url(#arr2)"/>
  <!-- Embedder box -->
  <rect x="375" y="155" width="110" height="125" rx="6" fill="#162032" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="430" y="178" text-anchor="middle" fill="#9b59b6" font-family="monospace" font-size="10" font-weight="bold">Gemini</text>
  <text x="430" y="194" text-anchor="middle" fill="#d7bde2" font-family="monospace" font-size="9">embedding-001</text>
  <rect x="388" y="202" width="84" height="18" rx="3" fill="#2c1654" stroke="#9b59b6" stroke-width="1"/>
  <text x="430" y="215" text-anchor="middle" fill="#bb8fce" font-family="monospace" font-size="8">retrieval_document</text>
  <rect x="388" y="228" width="84" height="18" rx="3" fill="#2c1654" stroke="#f39c12" stroke-width="1"/>
  <text x="430" y="241" text-anchor="middle" fill="#f0b27a" font-family="monospace" font-size="8">retrieval_query</text>
  <text x="430" y="268" text-anchor="middle" fill="#7fb3d3" font-family="monospace" font-size="8">task_type matters!</text>
  <!-- Arrow embedder -> chromadb -->
  <line x1="485" y1="218" x2="535" y2="218" stroke="#9b59b6" stroke-width="2" marker-end="url(#arr)"/>
  <!-- ChromaDB -->
  <ellipse cx="600" cy="200" rx="55" ry="14" fill="#1b2631" stroke="#e74c3c" stroke-width="1.5"/>
  <rect x="545" y="200" width="110" height="55" fill="#1b2631" stroke="#e74c3c" stroke-width="1.5"/>
  <ellipse cx="600" cy="255" rx="55" ry="14" fill="#1b2631" stroke="#e74c3c" stroke-width="1.5"/>
  <ellipse cx="600" cy="218" rx="55" ry="14" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.4"/>
  <ellipse cx="600" cy="236" rx="55" ry="14" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.4"/>
  <text x="600" y="232" text-anchor="middle" fill="#f1948a" font-family="monospace" font-size="10" font-weight="bold">ChromaDB</text>
  <text x="600" y="316" text-anchor="middle" fill="#f1948a" font-family="monospace" font-size="9">Vector Store</text>
  <!-- Question box -->
  <rect x="220" y="360" width="200" height="50" rx="8" fill="#1b2631" stroke="#f39c12" stroke-width="1.5"/>
  <text x="320" y="381" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="10" font-weight="bold">"What is the initiation</text>
  <text x="320" y="397" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="10" font-weight="bold">dose?"</text>
  <!-- Arrow question -> embedder -->
  <path d="M 320 360 Q 320 310 430 280" stroke="#f39c12" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr3)"/>
  <!-- Arrow chromadb -> answer -->
  <path d="M 600 269 Q 600 340 540 385" stroke="#e74c3c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <!-- Answer box -->
  <rect x="460" y="360" width="280" height="70" rx="8" fill="#1b2631" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="600" y="382" text-anchor="middle" fill="#1abc9c" font-family="monospace" font-size="10" font-weight="bold">Gemini 2.5 Flash Answer</text>
  <text x="600" y="398" text-anchor="middle" fill="#a9dfbf" font-family="monospace" font-size="9">Grounded to retrieved context only.</text>
  <text x="600" y="414" text-anchor="middle" fill="#a9dfbf" font-family="monospace" font-size="9">"I don't know" if not in context.</text>
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#d6eaf8" font-family="sans-serif" font-size="18" font-weight="bold">Clinical Drug Monograph RAG</text>
  <text x="400" y="70" text-anchor="middle" fill="#7fb3d3" font-family="sans-serif" font-size="13">Gemini Embeddings · ChromaDB · TNF Inhibitor Q&amp;A</text>
  <!-- Step labels -->
  <text x="115" y="130" text-anchor="middle" fill="#5d8aa8" font-family="sans-serif" font-size="10">① Load</text>
  <text x="275" y="165" text-anchor="middle" fill="#5d8aa8" font-family="sans-serif" font-size="10">② Chunk</text>
  <text x="430" y="145" text-anchor="middle" fill="#5d8aa8" font-family="sans-serif" font-size="10">③ Embed</text>
  <text x="600" y="185" text-anchor="middle" fill="#5d8aa8" font-family="sans-serif" font-size="10">④ Store</text>
  <text x="320" y="350" text-anchor="middle" fill="#5d8aa8" font-family="sans-serif" font-size="10">⑤ Query</text>
  <text x="600" y="350" text-anchor="middle" fill="#5d8aa8" font-family="sans-serif" font-size="10">⑥ Answer</text>
</svg>
