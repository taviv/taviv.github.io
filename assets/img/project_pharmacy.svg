<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0f1f3d"/>
  <!-- Grid lines -->
  <g stroke="#1a3a6e" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>
  <!-- Central database cylinder -->
  <ellipse cx="400" cy="175" rx="90" ry="22" fill="#1a5276" stroke="#2e86c1" stroke-width="2"/>
  <rect x="310" y="175" width="180" height="90" fill="#1a5276" stroke="#2e86c1" stroke-width="2"/>
  <ellipse cx="400" cy="265" rx="90" ry="22" fill="#1a5276" stroke="#2e86c1" stroke-width="2"/>
  <!-- Database stripes -->
  <ellipse cx="400" cy="200" rx="90" ry="22" fill="none" stroke="#2e86c1" stroke-width="1" opacity="0.5"/>
  <ellipse cx="400" cy="225" rx="90" ry="22" fill="none" stroke="#2e86c1" stroke-width="1" opacity="0.5"/>
  <ellipse cx="400" cy="250" rx="90" ry="22" fill="none" stroke="#2e86c1" stroke-width="1" opacity="0.5"/>
  <!-- Label -->
  <text x="400" y="222" text-anchor="middle" fill="#85c1e9" font-family="monospace" font-size="13" font-weight="bold">BigQuery</text>
  <text x="400" y="242" text-anchor="middle" fill="#85c1e9" font-family="monospace" font-size="11">60M patients</text>
  <!-- Satellite nodes -->
  <!-- Pharmacy -->
  <rect x="50" y="155" width="120" height="50" rx="8" fill="#154360" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="110" y="176" text-anchor="middle" fill="#1abc9c" font-family="monospace" font-size="11" font-weight="bold">Pharmacy Rx</text>
  <text x="110" y="194" text-anchor="middle" fill="#a9dfbf" font-family="monospace" font-size="10">1,300+ stores</text>
  <!-- Kiosk -->
  <rect x="50" y="285" width="120" height="50" rx="8" fill="#154360" stroke="#f39c12" stroke-width="1.5"/>
  <text x="110" y="306" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="11" font-weight="bold">BP Kiosks</text>
  <text x="110" y="324" text-anchor="middle" fill="#fad7a0" font-family="monospace" font-size="10">Afinion / A1C</text>
  <!-- Providers -->
  <rect x="630" y="155" width="120" height="50" rx="8" fill="#154360" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="690" y="176" text-anchor="middle" fill="#9b59b6" font-family="monospace" font-size="11" font-weight="bold">Providers</text>
  <text x="690" y="194" text-anchor="middle" fill="#d7bde2" font-family="monospace" font-size="10">IQVIA / Colleges</text>
  <!-- Surveys -->
  <rect x="630" y="285" width="120" height="50" rx="8" fill="#154360" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="690" y="306" text-anchor="middle" fill="#e74c3c" font-family="monospace" font-size="11" font-weight="bold">Surveys</text>
  <text x="690" y="324" text-anchor="middle" fill="#f1948a" font-family="monospace" font-size="10">Digital / CCHS</text>
  <!-- Connecting lines -->
  <line x1="170" y1="180" x2="310" y2="210" stroke="#1abc9c" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <line x1="170" y1="310" x2="310" y2="240" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <line x1="630" y1="180" x2="490" y2="210" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <line x1="630" y1="310" x2="490" y2="240" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- ML output nodes at bottom -->
  <rect x="130" y="395" width="140" height="45" rx="8" fill="#1b2631" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="200" y="415" text-anchor="middle" fill="#1abc9c" font-family="monospace" font-size="10" font-weight="bold">Adherence ML</text>
  <text x="200" y="430" text-anchor="middle" fill="#a9dfbf" font-family="monospace" font-size="9">NLP · Prediction</text>
  <rect x="330" y="395" width="140" height="45" rx="8" fill="#1b2631" stroke="#f39c12" stroke-width="1.5"/>
  <text x="400" y="415" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="10" font-weight="bold">Trial Matching</text>
  <text x="400" y="430" text-anchor="middle" fill="#fad7a0" font-family="monospace" font-size="9">NLP · Retrieval</text>
  <rect x="530" y="395" width="140" height="45" rx="8" fill="#1b2631" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="600" y="415" text-anchor="middle" fill="#9b59b6" font-family="monospace" font-size="10" font-weight="bold">Vaccination</text>
  <text x="600" y="430" text-anchor="middle" fill="#d7bde2" font-family="monospace" font-size="9">Targeting · Rules</text>
  <!-- Lines from DB to outputs -->
  <line x1="370" y1="287" x2="200" y2="395" stroke="#2e86c1" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="400" y1="287" x2="400" y2="395" stroke="#2e86c1" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="430" y1="287" x2="600" y2="395" stroke="#2e86c1" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#d6eaf8" font-family="sans-serif" font-size="18" font-weight="bold">Health Data &amp; AI/ML Platform</text>
  <text x="400" y="75" text-anchor="middle" fill="#7fb3d3" font-family="sans-serif" font-size="13">Loblaw Companies · 1,300+ pharmacies · 10M patients</text>
</svg>
